<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글 발행 — Jenniespark</title>
    <link
      href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css"
      rel="stylesheet"
    />
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #1a1a1a;
        background: #f4f4f5;
      }
      body {
        margin: 0;
        padding: 1.25rem;
        max-width: 56rem;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      .warn {
        background: #fef3c7;
        border: 1px solid #f59e0b;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      .grid {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      input[type="text"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem 0.6rem;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
        font: inherit;
      }
      textarea#excerpt {
        min-height: 4.5rem;
        resize: vertical;
      }
      #editor {
        min-height: 280px;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #d4d4d8;
      }
      .ql-toolbar.ql-snow {
        border-radius: 8px 8px 0 0;
        border-color: #d4d4d8;
      }
      .ql-container.ql-snow {
        border-radius: 0 0 8px 8px;
        border-color: #d4d4d8;
        min-height: 240px;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      button#save {
        padding: 0.55rem 1.1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: #18181b;
        color: #fff;
        cursor: pointer;
      }
      button#save:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #msg {
        font-size: 0.9rem;
      }
      #msg.ok {
        color: #15803d;
      }
      #msg.err {
        color: #b91c1c;
      }
      a.site {
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>글 발행</h1>
    <p class="warn">
      이 페이지는 정적 빌드에도 포함됩니다. 다만 저장/업로드 기능은
      <code>/__admin/api/*</code> 서버가 있을 때만 동작합니다. 저장 시 <code>posts/</code> 에 다음 번호
      <code>N.md</code>가 생성됩니다. 본문에 <code>---</code> 한 줄만 있는 구분선은 넣지
      마세요(프론트매터와 충돌).
    </p>
    <p>
      <a class="site" href="/__admin/edit">기존 글 수정</a>
      <a class="site" href="/">사이트로 돌아가기</a>
    </p>

    <div class="grid">
      <div>
        <label for="title">title <span style="color: #b91c1c">*</span></label>
        <input id="title" type="text" placeholder="글 제목" required />
      </div>
      <div>
        <label for="date">date <span style="color: #b91c1c">*</span></label>
        <input id="date" type="date" required />
      </div>
      <div>
        <label for="category">category <span style="color: #b91c1c">*</span></label>
        <select id="category" required></select>
      </div>
      <div>
        <label for="excerpt">excerpt <span style="color: #b91c1c">*</span></label>
        <textarea id="excerpt" placeholder="목록·메타용 한 줄 요약" required></textarea>
      </div>
    </div>

    <label for="editor-wrap">본문 (HTML 에디터)</label>
    <div id="editor"></div>

    <div class="actions">
      <button type="button" id="save">저장 · 새 posts/N.md</button>
      <span id="msg"></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <script>
      const msg = document.getElementById("msg");
      const saveBtn = document.getElementById("save");
      const imagePicker = document.createElement("input");
      imagePicker.type = "file";
      imagePicker.accept = "image/png,image/jpeg,image/gif,image/webp";
      imagePicker.style.display = "none";
      document.body.appendChild(imagePicker);

      document.getElementById("date").value = new Date()
        .toISOString()
        .slice(0, 10);

      const quill = new Quill("#editor", {
        theme: "snow",
        modules: {
          toolbar: [
            [{ header: [1, 2, 3, false] }],
            ["bold", "italic", "underline", "strike"],
            [{ list: "ordered" }, { list: "bullet" }],
            ["blockquote", "link", "image"],
            ["clean"],
          ],
        },
      });
      const toolbar = quill.getModule("toolbar");

      function pickImageFile() {
        return new Promise((resolve) => {
          imagePicker.value = "";
          imagePicker.onchange = () => {
            const file = imagePicker.files && imagePicker.files[0] ? imagePicker.files[0] : null;
            resolve(file);
          };
          imagePicker.click();
        });
      }

      function fileToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("이미지 파일을 읽지 못했습니다."));
          reader.readAsDataURL(file);
        });
      }

      async function uploadImage(file) {
        const dataUrl = await fileToDataUrl(file);
        const res = await fetch("/__admin/api/upload-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            filename: file.name,
            dataUrl,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok || !data.url) {
          throw new Error(data.error || res.statusText || "이미지 업로드 실패");
        }
        return data.url;
      }

      toolbar.addHandler("image", async () => {
        try {
          setMsg("이미지 선택 대기 중…", true);
          const file = await pickImageFile();
          if (!file) {
            setMsg("이미지 선택이 취소되었습니다.", false);
            return;
          }
          setMsg("이미지 업로드 중…", true);
          const url = await uploadImage(file);
          const range = quill.getSelection(true);
          const index = range ? range.index : quill.getLength();
          quill.insertEmbed(index, "image", url, "user");
          quill.setSelection(index + 1, 0, "silent");
          setMsg("이미지를 본문에 삽입했습니다.", true);
        } catch (e) {
          setMsg(String(e.message || e), false);
        }
      });

      fetch("/__admin/api/meta")
        .then((r) => r.json())
        .then((data) => {
          const sel = document.getElementById("category");
          (data.categories || []).forEach((c) => {
            const o = document.createElement("option");
            o.value = c.id;
            o.textContent = c.label + " (" + c.id + ")";
            sel.appendChild(o);
          });
        })
        .catch(() => {
          msg.className = "err";
          msg.textContent = "카테고리 목록을 불러오지 못했습니다. dev 서버인지 확인하세요.";
        });

      function setMsg(text, ok) {
        msg.textContent = text;
        msg.className = ok ? "ok" : "err";
      }

      saveBtn.addEventListener("click", async () => {
        const title = document.getElementById("title").value.trim();
        const date = document.getElementById("date").value;
        const category = document.getElementById("category").value;
        const excerpt = document.getElementById("excerpt").value.trim();
        const html = quill.root.innerHTML.trim();

        if (!title || !date || !category || !excerpt || !html) {
          setMsg("title, date, category, excerpt, 본문을 모두 채워 주세요.", false);
          return;
        }

        saveBtn.disabled = true;
        setMsg("저장 중…", true);
        try {
          const res = await fetch("/__admin/api/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, date, category, excerpt, html }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            throw new Error(data.error || res.statusText || "저장 실패");
          }
          setMsg(
            "저장됨: " + data.relPath + " — 미리보기 /posts/" + data.fileNum + "/",
            true,
          );
        } catch (e) {
          setMsg(String(e.message || e), false);
        } finally {
          saveBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
