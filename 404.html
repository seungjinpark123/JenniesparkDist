    <script>
      (() => {
        const scopes = document.querySelectorAll(".js-search-scope");
        if (!scopes.length) return;
        scopes.forEach((scope) => {
          const input = scope.querySelector(".js-post-search-input");
          if (!input) return;
          const shell = scope.nextElementSibling;
          const list = shell ? shell.querySelector(".js-post-search-list") : null;
          if (!list) return;
          const items = Array.from(list.querySelectorAll(".js-post-search-item"));
          const meta = scope.querySelector(".js-post-search-meta");
          const empty = shell ? shell.querySelector(".js-post-search-empty") : null;
          const total = items.length;
          const run = () => {
            const q = String(input.value || "").trim().toLowerCase();
            let visible = 0;
            items.forEach((item) => {
              const hay = String(item.getAttribute("data-search-text") || "");
              const ok = q === "" || hay.includes(q);
              item.hidden = !ok;
              if (ok) visible += 1;
            });
            if (meta) {
              meta.textContent = q ? "검색 결과 " + visible + "건" : "전체 " + total + "건";
            }
            if (empty) {
              empty.hidden = visible !== 0;
            }
          };
          input.addEventListener("input", run);
          run();
        });
      })();
    </script>
